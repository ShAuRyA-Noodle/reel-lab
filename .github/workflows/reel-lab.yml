name: Reel Lab verification

on:
  pull_request:
    paths:
      - "repos/hyperframes/**"
      - "repos/video-use/**"
      - ".github/workflows/reel-lab.yml"
  push:
    branches: [main]
    paths:
      - "repos/hyperframes/**"
      - "repos/video-use/**"
      - ".github/workflows/reel-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperframes:
    name: Moderate+ audit, build and render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repos/hyperframes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Audit moderate and higher findings
        run: bun audit --audit-level=moderate
      - run: bun run build
      - run: bun run --filter '*' typecheck
      - run: bun run lint
      - run: bun run --filter @hyperframes/core test
      - run: bun run --filter @hyperframes/engine test
      - run: bun run --filter @hyperframes/player test
      - run: bun run --filter @hyperframes/cli test
      - run: bun run --filter @hyperframes/studio test
      - run: bun run --filter @hyperframes/shader-transitions test
      - run: bun run --filter @hyperframes/aws-lambda test
      - name: Render H.264 smoke fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx puppeteer browsers install chrome-headless-shell@stable
          bun run --cwd packages/producer test mp4-h264-sdr --sequential

  video-use:
    name: Python lock and import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: repos/video-use
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v6
      - run: uv sync --locked
      - run: uv run python -c "from PIL import Image; print(Image.__version__)"
